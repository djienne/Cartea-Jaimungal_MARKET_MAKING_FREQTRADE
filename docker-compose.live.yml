services:
  cashcat-live:
    build:
      context: .
      dockerfile: rust_live/Dockerfile
    image: mm-live:local
    container_name: cashcat-live
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 90s
    command:
      - --config
      - /opt/mm/run/cashcat-active-live.toml
      - live
      - --duration-seconds
      - "0"
    cpus: 0.50
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - ./rust_live/run:/opt/mm/run
      - ./rust_live/reports:/opt/mm/reports
      - ./rust_live/config:/opt/mm/config:ro
      - ./scripts/HL_data:/opt/scripts/HL_data:ro
      - ./rust_live/hyperliquid.env:/opt/mm/hyperliquid.env:ro
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      TZ: UTC
    labels:
      - autoheal=true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /opt/mm/reports/live_active/live_heartbeat.json &&
          find /opt/mm/reports/live_active/live_heartbeat.json -mmin -1 | grep -q . &&
          grep -q '"operationally_healthy": true' /opt/mm/reports/live_active/live_heartbeat.json
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
