networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.0.0/24
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2025.4
    # image: freqtradeorg/freqtrade:develop
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # Build step - only needed when additional dependencies are needed
    build:
      context: .
      dockerfile: "./Dockerfile.technical"
    restart: unless-stopped
    container_name: MM_ADV
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '1024M'
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./scripts:/freqtrade/scripts"
    # Expose api on port 8080 (localhost only)
    # Please read the https://www.freqtrade.io/en/stable/rest-api/ documentation
    # before enabling this.
    # ports:
    #   - "127.0.0.1:3004:8080"
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy Market_Making
  hl-collector2:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: hl-collector2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '1024M'
    environment:
      SYMBOLS: ${SYMBOLS:-ETH}
      OUTPUT_DIR: ${OUTPUT_DIR:-HL_data}
      ORDERBOOK_DEPTH: ${ORDERBOOK_DEPTH:-20}
      # Restart/reconnect if no data arrives for this many seconds
      INACTIVITY_TIMEOUT_SEC: ${INACTIVITY_TIMEOUT_SEC:-180}
      MAX_RECONNECT_ATTEMPTS: ${MAX_RECONNECT_ATTEMPTS:-3}
      RECONNECT_BACKOFF_SEC: ${RECONNECT_BACKOFF_SEC:-5}
      TZ: ${TZ:-UTC}
    volumes:
      - ./scripts/HL_data:/app/HL_data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "run_collector.py"]
  param-estimator:
    image: freqtradeorg/freqtrade:2025.4
    build:
      context: .
      dockerfile: "./Dockerfile.technical"
    container_name: mm-param-estimator
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '1024M'
    environment:
      CRYPTO_NAME: ${PARAM_ESTIMATOR_SYMBOL:-ETH}
      TZ: ${TZ:-UTC}
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./scripts:/freqtrade/scripts"
    depends_on:
      - hl-collector2
    restart: unless-stopped
    command: >
      python /freqtrade/user_data/strategies/periodic_test_runner.py
      --loop
      --interval ${PARAM_ESTIMATOR_INTERVAL:-60}
      --crypto ${PARAM_ESTIMATOR_SYMBOL:-ETH}
      --lock-stale-seconds ${PARAM_UPDATE_LOCK_STALE_SECONDS:-3600}
