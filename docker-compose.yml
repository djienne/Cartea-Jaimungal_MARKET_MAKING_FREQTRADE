# The CASHCAT market-making dry-run grid, as a container.
#
# `docker compose up -d` starts the DRY RUN and nothing else. There is no live
# service in this file at all: `mm-live live` places real orders, needs
# credentials this image never receives, and must never be something an
# unattended `start_all.bat` can bring up. Run it by hand, from the host.
#
# WHY THIS EXISTS. The grid used to run as a bare `mm-live.exe` in a console
# window. On 2026-08-27 the machine was rebooted for a Windows update at 13:47
# and the grid simply did not come back -- nobody noticed for 66 h. Three
# separate things fix that here:
#
#   restart: unless-stopped  brings it back when Docker starts after a reboot
#                            (Docker Desktop must be set to start on login)
#   stop_signal: SIGINT      reaches the Linux SIGINT/SIGTERM handler the binary
#                            already has, so teardown actually runs -- on Windows
#                            a Start-menu shutdown bypassed it entirely
#   healthcheck + autoheal   restarts a container that is alive but blind, which
#                            `restart:` cannot see (see the healthcheck note)
#
# A side benefit: `cargo build` no longer fails with "Access is denied (os error
# 5)" because the running mm-live.exe holds the binary. The build happens in the
# image now, so a rebuild never contends with a live run.
services:
  mm-grid-dryrun:
    build:
      context: .
      dockerfile: rust_live/Dockerfile
    image: mm-live:local
    container_name: mm-grid-dryrun
    init: true

    # SIGINT, because `wait_for_shutdown_signal` selects on ctrl_c()/SIGTERM and
    # SIGINT is what ctrl_c() is on Linux. 60s rather than the 30s the sibling
    # Lighter grid uses: teardown walks every configured variant in turn,
    # calling backend.shutdown() and flushing its event log.
    stop_signal: SIGINT
    stop_grace_period: 60s
    # unless-stopped, not always: a container the daemon stopped (a reboot,
    # Docker Desktop closing) comes back, while one you stopped on purpose stays
    # stopped. The corollary is worth knowing -- verified 2026-08-30 by killing
    # this container, which left it Exited(137) with RestartCount=0 -- so after
    # a deliberate `docker compose stop`, run `up -d` before walking away or it
    # will still be down after the next reboot.
    restart: unless-stopped

    # One WebSocket for the whole grid, by design -- Hyperliquid allows ten per
    # IP and that budget is shared with the collector containers. Bridge
    # networking NATs through the host's address, so the count is unchanged.
    network_mode: bridge

    # --duration-seconds 0 runs until stopped. The out-dir is the path the
    # healthcheck in the Dockerfile reads.
    command:
      - --config
      - /opt/mm/config/cashcat_dryrun_realistic.toml
      - dry-run-grid
      - --grid
      - /opt/mm/config/grid_cashcat.toml
      - --duration-seconds
      - "0"
      - --out-dir
      - /opt/mm/reports/grid_live

    # Deliberately tiny (user, 2026-08-30) -- host headroom matters more here
    # than speed. Measured steady state is 0.48% of a core, so a 25% quota is
    # roughly fifty times the idle draw and the simulated 150 ms latencies mean
    # real compute time does not enter the economics.
    #
    # THE RISK THIS TAKES, and the thing to watch: the grid is bursty, and if it
    # cannot drain the feed fast enough the causal market-event ring saturates.
    # That is the one failure this project never tolerates -- downtime is
    # counted and judged, but event loss means the simulation processed the
    # wrong *sequence*, so it is always disqualifying. Watch
    # `market_event_ring_high_water` in the session reports and
    # `dropped_causal_events` in the metrics; if either moves, raise this back.
    #
    # A container still sees every host core regardless of the quota, so
    # `runtime.hot_path_cpu` pins against the real topology -- read the
    # "runtime configured" line rather than assuming the two agree.
    cpus: 0.25
    mem_limit: 4g
    memswap_limit: 4g

    volumes:
      # Read-only: a variant sweep is edited on the host and picked up on
      # restart, without a rebuild.
      - ./rust_live/config:/opt/mm/config:ro
      - ./rust_live/reports:/opt/mm/reports
      - ./rust_live/run:/opt/mm/run
      # /opt/scripts, one level above the config mount above. Configs set
      # data_dir = "../../scripts/HL_data", resolved relative to the config file
      # rather than the CWD, so /opt/mm/config/../../scripts is /opt/scripts.
      # The grid calibrates from this tape at startup and refuses to run without
      # it. Read-only: the collectors own these files, this only reads them.
      - ./scripts/HL_data:/opt/scripts/HL_data:ro

    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      TZ: UTC

    # Watched by the autoheal container in ../HYPERLIQUID_DATA/docker-compose.yml,
    # which is scoped by this label. It restarts an unhealthy container --
    # `restart: unless-stopped` only reacts to one that has exited, and the
    # failure that cost 19.65 h of data never exited anything.
    labels:
      - autoheal=true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Period archiver. The CASHCAT collector keeps 30 days and deletes the rest, so
  # a replay window is destroyed on a clock: once August rolls off, no sweep can
  # ever score August again. Every 21 days this runs a fresh full sweep and saves
  # it with the grid's P&L curve under docs/history/, which is tracked.
  #
  # 21 against 30 leaves 9 days of slack, so a skipped or failed cycle still
  # loses nothing -- the next window reaches back over the gap.
  # ---------------------------------------------------------------------------
  mm-archiver:
    build:
      context: ./scripts
      dockerfile: Dockerfile.archive
    image: mm-archiver:local
    container_name: mm-archiver
    init: true
    restart: unless-stopped

    # No network at all. It reads local Parquet and writes local files; the only
    # thing an outbound socket could do here is surprise us.
    network_mode: none

    # Deliberately tiny (user, 2026-08-30). This is the *Python* sweep, not the
    # Rust grid: sweep_replay.py is numpy/pandas and will use every core it is
    # given -- measured at 388% and 5.4 GiB with four workers. The archive is a
    # background job on a 21-day cadence, so wall-clock is nearly free here and
    # host headroom is not. Expect a sweep to take many hours rather than the
    # ~30 min the four-worker figure implies.
    #
    # --workers 1 goes with it: four workers sharing a quarter core only
    # context-switch, and each holds its own slice of a 2.6M-row tape, which is
    # what the 5.4 GiB was.
    cpus: 0.25
    mem_limit: 6g
    memswap_limit: 6g

    volumes:
      # Mirrors the repo layout, because sweep_replay.py and grid_pnl_curve.py
      # both derive their roots from __file__ and their defaults then resolve.
      - ./scripts:/app/scripts:ro
      # Mounted again, nested, because scripts/HL_data is an NTFS junction onto
      # ../HYPERLIQUID_DATA. The mount above hands the container a dangling
      # symlink -- Docker does not follow a host link out of the mounted tree --
      # so the tape needs its own bind, exactly as mm-grid-dryrun does.
      - ./scripts/HL_data:/app/scripts/HL_data:ro
      - ./rust_live/reports:/app/rust_live/reports:ro
      # The one writable mount: where the archives land.
      - ./docs/history:/app/docs/history
      # Read-only, and only for the uncommitted-periods count. The archiver
      # deliberately does not commit -- that would mean an SSH key in a
      # container -- so it reports the count and leaves the commit to a human.
      - ./.git:/app/.git:ro

    environment:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      # git refuses a repo owned by another user unless told otherwise, and the
      # bind mount always looks that way from inside.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app

    command:
      - --loop
      - --cadence-days
      - "21"
      - --workers
      - "1"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
