[package]
name = "mm-runtime"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Bounded runtime coordination, hot-thread publications, and latency observation"

[dependencies]
anyhow = "=1.0.104"
arc-swap = "=1.9.2"
cj-core = { path = "../cj-core" }
core_affinity = "=0.8.3"
crossbeam-queue = "=0.3.13"
mm-settings = { path = "../mm-settings" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync"] }
tracing = "=0.1.44"

[dev-dependencies]
allocation-counter = "=0.8.1"
futures-util = "=0.3.34"
proptest = "=1.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
too_many_arguments = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
field_reassign_with_default = "allow"
