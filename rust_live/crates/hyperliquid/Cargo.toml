[package]
name = "hyperliquid-connector"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Pure-Rust Hyperliquid public/account/action transport and live execution boundary"

[features]
default = []
acceptance = []

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.92"
cj-core = { path = "../cj-core" }
fs2 = "=0.4.3"
futures-util = "=0.3.34"
hex = "=0.4.3"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
mm-config = { path = "../mm-config" }
mm-execution = { path = "../mm-execution" }
mm-runtime = { path = "../mm-runtime" }
redb = "=4.2.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rmp-serde = "=1.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "=0.1.44"
zeroize = "=1.9.0"

[dev-dependencies]
proptest = "=1.11.0"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
too_many_arguments = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
field_reassign_with_default = "allow"
