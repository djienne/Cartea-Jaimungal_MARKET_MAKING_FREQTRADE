[package]
name = "mm-config"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Central validated configuration schema for the market-making runtime"

[dependencies]
anyhow = "=1.0.104"
hex = "=0.4.3"
mm-settings = { path = "../mm-settings" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
toml = "=0.8.23"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
too_many_arguments = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
field_reassign_with_default = "allow"
