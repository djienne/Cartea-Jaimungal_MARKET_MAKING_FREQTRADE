[package]
name = "cj-data"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Cartea-Jaimungal calibration, Parquet collection, and deterministic replay"

[dependencies]
anyhow = "=1.0.104"
arrow-array = "=59.2.0"
arrow-cast = "=59.2.0"
arrow-schema = "=59.2.0"
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
cj-core = { path = "../cj-core" }
fs2 = "=0.4.3"
hex = "=0.4.3"
mm-execution = { path = "../mm-execution" }
mm-settings = { path = "../mm-settings" }
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["time"] }
tracing = "=0.1.44"

[dev-dependencies]
approx = "=0.5.1"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
too_many_arguments = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
field_reassign_with_default = "allow"
