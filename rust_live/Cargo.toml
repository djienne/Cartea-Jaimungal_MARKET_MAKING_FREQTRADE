[workspace]
members = [
    "crates/cj-core",
    "crates/cj-data",
    "crates/mm-execution",
    "crates/mm-config",
    "crates/mm-runtime",
    "crates/mm-settings",
    "crates/hyperliquid",
]
resolver = "2"

[package]
name = "mm-live"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
build = "build.rs"
license = "MIT"
description = "Generic Cartea-Jaimungal market-making research engine, validated for CASHCAT"

[features]
default = []
live-acceptance = ["hyperliquid-connector/acceptance"]

[lib]
name = "mm_live"
path = "src/lib.rs"

[[bin]]
name = "mm-live"
path = "src/main.rs"

[[bin]]
name = "hot-path-bench"
path = "src/bin/hot_path_bench.rs"

[[bin]]
name = "mm-live-acceptance"
path = "src/bin/mm_live_acceptance.rs"
required-features = ["live-acceptance"]

[dependencies]
anyhow = "=1.0.104"
arc-swap = "=1.9.2"
clap = { version = "=4.6.6", features = ["derive"] }
core_affinity = "=0.8.3"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
tempfile = "=3.27.0"
# Already in the lockfile via mm-config; the grid spec is TOML like the configs.
toml = "=0.8.23"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
# Already in the lockfile via cj-data's parquet "zstd" feature, so this adds no
# new transitive dependencies. Used to compress the long-running dry-run event
# logs (docs/DRY_RUN_GRID.md).
zstd = "=0.13.3"
cj-core = { path = "crates/cj-core" }
cj-data = { path = "crates/cj-data" }
mm-execution = { path = "crates/mm-execution" }
mm-config = { path = "crates/mm-config" }
mm-runtime = { path = "crates/mm-runtime" }
hyperliquid-connector = { path = "crates/hyperliquid" }

[dev-dependencies]
approx = "=0.5.1"
futures-util = "=0.3.34"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }

[profile.release]
codegen-units = 1
lto = "fat"
# Unwind, not abort: a panic in any task must not bypass the live teardown that
# cancels resting orders. Abort would leave live exposure to the venue dead-man
# deadline, and accounts below the venue's cumulative-volume threshold cannot
# arm a dead-man at all.
panic = "unwind"
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 3
debug = 1
debug-assertions = true
overflow-checks = true

[profile.test]
opt-level = 3
debug = 1
debug-assertions = true
overflow-checks = true

[profile.bench]
codegen-units = 1
lto = "fat"
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = 1
strip = "none"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
too_many_arguments = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
field_reassign_with_default = "allow"
