[package]
name = "mm-live-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.151"
hyperliquid-connector = { path = "../crates/hyperliquid" }

[[bin]]
name = "account_decoders"
path = "fuzz_targets/account_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "public_wire_decoders"
path = "fuzz_targets/public_wire_decoders.rs"
test = false
doc = false
bench = false

[workspace]

[profile.dev]
opt-level = 3
debug = 1
debug-assertions = true
overflow-checks = true

[profile.test]
opt-level = 3
debug = 1
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
