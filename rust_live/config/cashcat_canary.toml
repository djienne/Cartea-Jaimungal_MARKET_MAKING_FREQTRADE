# Bounded operational canary; enable explicitly before a real-money run.
# Adapted from sweep1_flat300: rolling 1000/1000 ms, 0.75/0.75 depth fits
# replace its frozen sweep_a parameters; q_max is one minimum-size live lot.
# The 20-minute hold/address pacing and 30/60-second feed thresholds differ
# from paper execution. A requested 1 ms exit is not a 1 ms venue fill.
# It sets live.flatten_after_ms = 1 where config/cashcat.toml sets 301 for the
# same row. The live timer adds no latency legs, so 1 means "cross as soon as
# the position is seen" and 301 reproduces the paper row's effective hold
# (1 + decision 150 + acknowledgement 150). This canary asks how fast the stack
# can exit; the production profile reproduces what was scored. Not a conflict.
# Numerical settings below follow the paper grid; the September 8 canary
# used dt=0.25 s/tolerance=1e-8 and does not validate these tighter settings.
[instrument]
profile = "cashcat"
symbol = "CASHCAT"
validated = true
expected_sz_decimals = 0
minimum_notional = 10.0
evidence_path = "cashcat.validation.json"

[runtime]
network = "mainnet"
hot_path_cpu = 4
market_stale_ms = 30000
ws_ping_interval_ms = 5000
ws_idle_timeout_ms = 60000

[latency]
gate_enabled = true
max_acceptable_p95_ms = 2000.0
minimum_samples = 20
minimum_network_samples = 10
max_sample_age_ms = 15000
window_seconds = 60

[storage]
data_dir = "../../scripts/HL_data"
state_path = "../run/cashcat-canary-dry.json"
calibration_path = "../run/cashcat-canary-calibration.json"
latency_path = "../run/cashcat-canary-latency.json"
report_dir = "../reports/cashcat_canary"
writer_lock_path = "../run/cashcat-canary-collector.lock"
write_parquet = false
live_log_max_mb = 64
live_log_keep = 3

[calibration]
window_minutes = 120
interval_seconds = 30
epsilon_horizon_ms_plus = 1000
epsilon_horizon_ms_minus = 1000
support_quantile_lower_plus = 0.75
support_quantile_lower_minus = 0.75
max_age_seconds = 120
max_data_age_seconds = 120
min_kappa_fit_points = 6
min_kappa_r2 = 0.30
min_epsilon_events = 50
max_toxicity = 1.5

[model]
q_max = 1
horizon_seconds = 150.0
phi_kappa_t = 3000.0
phi_kappa_t_max = 3000.0
alpha_kappa = 0.05
max_dt_seconds = 0.001953125
max_steps = 153600
newton_max_iterations = 100
newton_tolerance = 1e-10

[quoting]
available_capital_usdc = 11.0
target_capital_utilisation = 0.98
leverage = 1.0
maker_fee_rate = 0.00015
min_half_spread_bps = 60.0
max_half_spread_bps = 80.0
replace_threshold_bps = 2.0
min_order_lifetime_ms = 1200000
reduce_only_threshold_q = 1.0

[risk]
max_notional_usdc = 11.0
max_margin_usdc = 11.0
min_liquidation_buffer_usdc = 90.0
max_daily_loss_usdc = 0.25

[flow_guard]
enabled = true

[live]
enabled = false
mode = "production"
credentials_path = "../hyperliquid.env"
state_path = "../run/cashcat-canary.redb"
action_timeout_ms = 3000
action_expiry_ms = 5000
reconcile_interval_ms = 300000
startup_warmup_seconds = 0
# This small subaccount could not arm the venue dead-man. Use supervised,
# bounded runs and explicit cleanup; this profile is not an unattended service.
deadman_enabled = false
flatten_on_stop = true
flatten_after_ms = 1
emergency_flatten_max_slippage_bps = 250.0
max_rest_weight_per_minute = 1000
address_action_reserve = 100
address_safety_action_reserve = 1
quota_horizon_seconds = 14400
production_max_daily_realized_loss_usdc = 0.25
