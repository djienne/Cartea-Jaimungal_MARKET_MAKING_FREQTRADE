[instrument]
profile = "cashcat"
symbol = "CASHCAT"
dex = ""
validated = true
expected_sz_decimals = 0
max_significant_figures = 5
minimum_notional = 10.0
evidence_path = "cashcat.validation.json"

[runtime]
network = "mainnet"
# Dedicated hot-path core; tokio workers, the blocking pool, and writer
# threads are pinned to the other cores. Pair with OS-level isolation for a
# genuinely quiet core.
hot_path_cpu = 4
# Raised from 5000 on 2026-09-07: CASHCAT's BBO stream idles past 5 s about 34
# times an hour (median pause 1.6 s), and every pause cancels all resting orders.
market_stale_ms = 10000
# How late a genuinely NEW trade may arrive before the socket is treated as
# broken and reconnected. Not the quoting guard -- market_stale_ms above is what
# decides whether the book is fresh enough to quote from. Raised from 5000 on
# 2026-08-25: six measured trips were 5336/5607/5966/6106/6301/9852 ms, all on
# genuinely live trades, i.e. a delivery tail above the old line rather than a
# broken feed. Set above the observed max with room, not against it.
max_trade_lag_ms = 15000
ws_ping_interval_ms = 5000
ws_idle_timeout_ms = 15000
market_event_capacity = 65536
execution_event_capacity = 16384
stats_interval_ms = 5000
log_json = false

[latency]
gate_enabled = true
max_acceptable_p95_ms = 150.0
minimum_samples = 20
# 10, not 20: a 60s window at a 5s ping interval can hold at most 12
# network samples, so 20 made the production gate unsatisfiable and
# warm-up never completed. validate() now rejects impossible values.
minimum_network_samples = 10
max_sample_age_ms = 15000
hot_sample_every = 16
window_seconds = 60
queue_capacity = 16384

[storage]
data_dir = "../../scripts/HL_data"
state_path = "../run/cashcat-dry-state.json"
calibration_path = "../run/cashcat-calibration.json"
latency_path = "../run/cashcat-latency.json"
report_dir = "../reports"
writer_lock_path = "../run/cashcat-collector.lock"
flush_interval_seconds = 10
compact_after_minutes = 15
retention_minutes = 180
# Only affects `dry-run`. The `live` command never records Parquet and never
# takes the writer lock, so a live session cannot disturb the reference
# collector (the hl-cashcat-collector Docker container). See
# docs/DATA_COLLECTION.md.
write_parquet = true
live_log_max_mb = 64
live_log_keep = 3

[calibration]
window_minutes = 120
interval_seconds = 30
epsilon_horizon_ms_plus = 200
epsilon_horizon_ms_minus = 200
support_quantile_lower_plus = 0.0
support_quantile_lower_minus = 0.0
support_quantile_upper_plus = 0.99
support_quantile_upper_minus = 0.99
outage_threshold_seconds = 60.0
max_age_seconds = 120
max_data_age_seconds = 120
max_future_skew_seconds = 10
min_kappa_fit_points = 6
min_kappa_r2 = 0.30
min_epsilon_events = 50
max_toxicity = 1.5
shard_window_margin_seconds = 120
max_shard_failure_rate = 0.05

[model]
# DEFAULT = the dry-run grid's `sweep1_flat300` row, chosen 2026-09-10. It is
# the only row whose P&L is fully realised: net equals realised, inventory ends
# at zero and max drawdown stays under 2 USDC, while `wide60` tops the board on
# an open directional position. Change these back to q_max=6 / phiKT=300/450 to
# return to the shipped control.
#
# TWO THINGS THIS CANNOT COPY from that row, both material:
#   1. It used the FROZEN `sweep_a` fit from `grid_cashcat.toml`. A live run has
#      no way to pin parameters -- it always calibrates -- so live tracks the
#      market instead of that fit. The knobs below are the row; the parameters
#      are not.
#   2. The paper deadline adds the decision and acknowledgement legs; the live
#      one does not. See `live.flatten_after_ms`.
q_max = 3
horizon_seconds = 150.0
# Raised 200 -> 300 (cap 300 -> 450) on 2026-09-02 from a held-out phi
# ladder. That ladder was run by the retired Python sweep and cannot be
# reproduced; the numbers are kept here because this comment is now the only
# record of them. Held-out P&L, 118.7 h after the 08-28 split, AT THIS
# PROFILE'S horizon_seconds = 150:
#
#   phi*kappa*T   100     200     300     400     600    1000    3000
#   eps500      -346.16 -235.47 -137.14 -149.95  -69.86  -57.65  -52.73
#   eps1000     -309.92 -213.92 -166.15 -204.17 -119.38  -39.60  -22.62
#
# READ THREE THINGS OFF THAT, none of them comfortable:
#
# 1. THE HORIZON IS PART OF THE NUMBER. phi_kappa_t is dimensionless only with
#    T fixed -- the solver uses raw phi = phi_kappa_t/(kappa*T) and the surface
#    is stationary away from the terminal layer, so 400 at T=300 is the SAME
#    control as 200 at T=150. A first version of this promotion was chosen from
#    a ladder run at T=300 and shipped at T=150, which silently doubled the
#    intended step. Any future ladder must be run at the horizon it will ship
#    at, and must state that horizon beside the number.
#
# 2. THE CURVE IS NOT MONOTONE. 400 is a local dip in BOTH calibrations. The
#    argmax is 3000, at the top of the grid, and the gradient points there the
#    whole way -- which is a warning, not an endorsement: an optimum pinned to
#    the edge of a grid means the grid is truncated, not that the edge is best.
#    2026-09-02 took a deliberately small step to 300 for that reason.
#    2026-09-10 went to 3000 anyway, because `sweep1_flat300` is that value and
#    that row is the one the grid measured as fully realised. Read this as
#    following a measured row, not as the ladder having chosen 3000.
#
# 3. IT IS STILL A LOSS. Every rung loses. Held-out spread capture is positive
#    at every phi and adverse selection is always slightly larger, so raising
#    phi trades less and loses less; it never turns a profit. Most of the
#    improvement is fill count, not better per-fill economics.
#
# And a caveat that limits all of the above: at any phi*kappa*T >= 100 the
# integer-inventory quotes are IDENTICAL after clamping. With the 60 bps floor
# this profile now ships, EVERY quote is clamped -- the whole ladder reads 60
# (floor) or 80 (cap) and nothing between -- so phi bites only through the
# fractional-q interpolation between two clamped rows. So this axis is steering a
# clamp geometry rather than the Cartea-Jaimungal control, and no value of it
# addresses the real problem -- epsilon is fitted from unconditional market
# order impact (~5 bps) while our fills actually suffer 22-29 bps.
#
# THE CAP MUST MOVE WITH PHI. hjb.rs rescales phi so phi*kappa*T never exceeds
# phi_kappa_t_max, so raising phi alone silently keeps the old ceiling.
# AppConfig::validate refuses a cap below its phi. Cap == phi here, so there is
# NO headroom and the volatility channel (volatility_risk_coefficient) is
# clamped off entirely -- deliberate, because that is what `sweep1_flat300`
# does, but it is a live behaviour change from the 1.5x headroom of 300/450.
#
# NUMERICAL COST, measured 2026-09-10. phi*kappa*T = 3000 narrows the stable
# timestep sharply. At the live-calibrated kappa (~9600) the solve converges at
# the shipped max_dt_seconds = 0.25 and DIVERGES at 0.5; at 300/450 it converged
# at every step tried up to 5 s. So this profile sits one halving from a
# non-converging HJB. That fails closed at startup rather than quoting badly,
# but do not coarsen the step, and re-check convergence if kappa climbs.
phi_kappa_t = 3000.0
phi_kappa_t_max = 3000.0
alpha_kappa = 0.05
raw_phi_fallback = 0.0001
raw_alpha_fallback = 0.001
volatility_risk_coefficient = 0.05
max_dt_seconds = 0.25
min_steps = 200
max_steps = 2000
newton_max_iterations = 50
newton_tolerance = 1e-8
newton_damping = 0.7
episode_reset_on_flat = true
episode_min_elapsed_fraction = 0.25

[quoting]
available_capital_usdc = 1000.0
target_capital_utilisation = 0.74
leverage = 2.0
maker_fee_rate = 0.00015
spread_multiplier = 1.0
extra_cushion_bps = 0.0
# 60 bps floor, from `sweep1_flat300`. Every profitable grid row has it; the
# band is 60-80 rather than 1.5-80.
min_half_spread_bps = 60.0
max_half_spread_bps = 80.0
replace_threshold_ticks = 1
# Hold a resting quote while the new target is within this window (max of
# ticks and bps), preserving queue position and WebSocket budget. Default from
# the remediation plan, measured by a replay whose engine has since been
# replaced; re-measure with `mm-live replay` before treating 2.0 as tuned.
replace_threshold_bps = 2.0
min_order_lifetime_ms = 100
reduce_only_threshold_q = 3.0

[risk]
kill_switch = false
max_notional_usdc = 3200.0
max_margin_usdc = 1600.0
min_liquidation_buffer_usdc = 100.0
maintenance_margin_rate = 0.05
max_daily_loss_usdc = 200.0
max_market_spread_bps = 100.0

[dry_run]
starting_equity_usdc = 1000.0
decision_latency_ms = 250
acknowledgement_latency_ms = 250
cancel_latency_ms = 250
tail_latency_multiplier = 2.35
tail_latency_every = 20
promotion_flatten_fee_rate = 0.00035
promotion_flatten_slippage_bps = 25.0
# Measured from the venue (metaAndAssetCtxs, 2026-08-23). It is not zero for
# this instrument, and 0.0 silently omitted a real cost from every dry run.
funding_rate_per_hour = 0.0000125
markout_horizons_ms = [100, 1000, 5000, 30000]

[flow_guard]
# Toxic-flow guard. The 161.95 h tape had one losing six-hour window (-241.17
# on 1,771 fills) and it was a liquidation cascade: mid -1% -> -31% in ten
# seconds, -70% in sixty. The guard does not predict it; these thresholds bound
# additional exposure after the move is observable. See docs/TOXIC_FLOW_GUARD.md.
enabled = true
# Fast breaker. 800 bps (8%) in 5s was the tightest threshold with ZERO false
# positives across the whole tape; 5% produced four. It fired at -14% where
# VPIN needed -45%.
fast_move_window_ms = 5000
fast_move_threshold_bps = 800.0
# VPIN uses an activity-scaled bucket size. Threshold provenance:
# scripts/guard_study/reverify_thresholds.json.
vpin_buckets_per_day = 50
vpin_window_buckets = 30
vpin_threshold = 0.40
# Re-entry needs BOTH this cooldown AND VPIN back under threshold: VPIN alone
# can dip mid-cascade, and a timer alone would re-enter a live one.
cooldown_ms = 900000
# While VPIN is still warming up (~14 h after a restart at 30 buckets of
# daily_volume/50) a trip used to stay closed for the rest of the warm-up.
# Re-entry during warm-up needs this longer cooldown AND a trailing mid move
# under warmup_reentry_calm_fraction x fast_move_threshold_bps; a fresh breach
# re-arms the clock.
warmup_reentry_cooldown_ms = 1800000
warmup_reentry_calm_fraction = 0.5
# Publish the inventory-reducing side as reduce-only while tripped instead of
# withdrawing entirely. Off until studied on the 2026-08-22 cascade replay.
reduce_only_while_tripped = false

[live]
enabled = false
mode = "production"
credentials_path = "../hyperliquid.env"
state_path = "../run/cashcat-live.redb"
action_timeout_ms = 2000
action_expiry_ms = 5000
max_quote_command_age_ms = 1000
reconcile_interval_ms = 300000
startup_warmup_seconds = 120
account_snapshot_timeout_ms = 10000
deadman_enabled = true
# 8 h deadline / 6 h refresh is an address-action BUDGET decision, not a safety
# choice: every refresh spends one action from the venue's lifetime budget
# (10k + 1 per USDC of volume; ~115 left on this account, 2026-09-01), so a
# 30 s deadline refreshed every 10 s (the recommended policy in
# HYPERLIQUID_LIVE_CONNECTOR.md 7.5) would cost ~8.6k actions a day. The
# consequence: after a hard crash, resting orders can sit for up to 8 h. The
# real safety net is the teardown that runs on every exit path (cancel,
# reconcile, clear) plus `live-flatten`; tighten this once the account has
# earned budget. The venue also refused scheduleCancel on this subaccount on
# 2026-08-22 for lacking 1M USDC cumulative volume.
deadman_deadline_ms = 28800000
deadman_refresh_ms = 21600000
max_maker_fee_rate = 0.0002
# The timed taker exit of `sweep1_flat300`, which is what makes that row's P&L
# realised rather than a marked-to-market position.
#
# 301, NOT 1. The two simulators state this deadline differently and the paper
# row's `flatten_after_ms = 1` is not the number to copy. Paper adds the
# decision and acknowledgement legs (1 + 150 + 150 = 301 ms effective); live
# adds nothing (`hyperliquid_live.rs::observe_inventory_for_timed_exit`), so 1
# here would cross out the moment a position is seen -- a far more aggressive
# policy than the one that was measured. 301 reproduces the measured one.
#
# The live timer is also POSITION-level, not per-lot: it starts when inventory
# leaves zero and only an authoritative flat observation resets it, so a
# topped-up position exits on the first unit's clock. Paper ages each lot FIFO.
# Close, not identical.
#
# Zero disables it and returns to holding for a passive offset.
#
# config/cashcat_canary.toml sets 1 for the same row on purpose: it measures
# how fast the stack can exit, while this profile reproduces the deadline the
# row was scored with. Different questions, not a disagreement.
flatten_after_ms = 301
flatten_on_stop = true
emergency_flatten_max_slippage_bps = 250.0
max_rest_weight_per_minute = 400
max_ws_messages_per_minute = 240
max_inflight_posts = 8
cancel_reserve_fraction = 0.25
address_action_reserve = 100
address_safety_action_reserve = 10
quota_horizon_seconds = 43200
user_rate_limit_refresh_ms = 60000
safety_rest_weight_reserve = 100
min_order_notional_multiplier = 1.05
max_order_notional_multiplier = 1.10
max_directional_notional_multiplier = 1.10
max_working_gross_multiplier = 2.20
# Transient caps bound exposure while a replacement's cancel is still in
# flight (the old and new lot both exist for one round trip). The steady caps
# above apply once the cancel lands. Exactly one in-flight duplicate per side.
max_transient_directional_notional_multiplier = 2.20
max_transient_working_gross_multiplier = 4.40
production_max_daily_realized_loss_usdc = 1.0
acceptance_max_order_notional_usdc = 12.0
acceptance_max_directional_notional_usdc = 12.0
acceptance_max_working_gross_usdc = 24.0
acceptance_max_transient_directional_notional_usdc = 24.0
acceptance_max_transient_working_gross_usdc = 48.0
acceptance_max_turnover_usdc = 60.0
acceptance_max_realized_loss_usdc = 0.5
